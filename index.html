<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tic Tac Toe</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --accent: #38bdf8;
      --x-color: #22d3ee;
      --o-color: #f472b6;
      --text: #f8fafc;
      --muted: #94a3b8;
      --win: #4ade80;
      --shadow: 0 20px 50px rgba(0,0,0,0.4);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
      animation: fadeIn 0.6s ease;
    }

    h1 {
      font-size: 3rem;
      letter-spacing: -1px;
      margin-bottom: 8px;
      background: linear-gradient(to right, var(--x-color), var(--o-color));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      color: var(--muted);
      font-size: 1rem;
    }

    .game-container {
      display: flex;
      gap: 40px;
      align-items: flex-start;
      justify-content: center;
      flex-wrap: wrap;
      width: 100%;
      max-width: 900px;
    }

    /* Scoreboard */
    .scoreboard {
      display: flex;
      gap: 30px;
      margin-bottom: 30px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .score-card {
      background: var(--panel);
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 20px 32px;
      text-align: center;
      min-width: 140px;
      box-shadow: var(--shadow);
      transition: transform 0.2s;
    }

    .score-card.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.2), var(--shadow);
    }

    .score-card.x .name { color: var(--x-color); }
    .score-card.o .name { color: var(--o-color); }

    .name {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      margin-bottom: 8px;
      font-weight: 700;
    }

    .score {
      font-size: 2.2rem;
      font-weight: 800;
    }

    .draws .name { color: var(--muted); }

    /* Board */
    .board {
      display: grid;
      grid-template-columns: repeat(3, 100px);
      grid-template-rows: repeat(3, 100px);
      gap: 12px;
      background: #334155;
      padding: 12px;
      border-radius: 20px;
      box-shadow: var(--shadow);
    }

    .cell {
      width: 100px;
      height: 100px;
      background: var(--panel);
      border: none;
      border-radius: 16px;
      font-size: 2.6rem;
      font-weight: 800;
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      position: relative;
    }

    .cell:hover {
      background: #475569;
      transform: scale(0.96);
    }

    .cell:active {
      transform: scale(0.9);
    }

    .cell.x { color: var(--x-color); }
    .cell.o { color: var(--o-color); }

    .cell.winner {
      background: linear-gradient(135deg, var(--win), #22c55e);
      color: #fff !important;
      box-shadow: 0 0 20px rgba(74, 222, 128, 0.5);
    }

    /* Status */
    .status {
      text-align: center;
      margin: 24px 0;
      font-size: 1.4rem;
      font-weight: 700;
      min-height: 34px;
      animation: slideUp 0.3s ease;
    }

    .status .turn-x { color: var(--x-color); }
    .status .turn-o { color: var(--o-color); }
    .status .winner-text { color: var(--win); }

    /* Controls */
    .controls {
      display: flex;
      gap: 16px;
      justify-content: center;
      margin-top: 30px;
      flex-wrap: wrap;
    }

    button {
      padding: 12px 28px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      background: var(--panel);
      color: var(--text);
      border: 1px solid #334155;
    }

    button:hover {
      background: #334155;
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    button.primary {
      background: linear-gradient(135deg, var(--x-color), var(--o-color));
      color: #000;
      border: none;
    }

    button.primary:hover {
      filter: brightness(1.1);
      transform: translateY(-2px);
    }

    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    .cell.pop { animation: pop 0.2s ease; }

    /* Responsive */
    @media (max-width: 480px) {
      .board { grid-template-columns: repeat(3, 80px); grid-template-rows: repeat(3, 80px); }
      .cell { width: 80px; height: 80px; font-size: 2rem; }
      h1 { font-size: 2rem; }
      .game-container { flex-direction: column; align-items: center; }
    }
  </style>
</head>
<body>

  <header>
    <h1>Tic Tac Toe</h1>
    <p class="subtitle">Classic X vs O — Challenge a friend</p>
  </header>

  <div class="scoreboard">
    <div class="score-card x active" id="cardX">
      <div class="name">Player X</div>
      <div class="score" id="scoreX">0</div>
    </div>
    <div class="score-card draws">
      <div class="name">Draws</div>
      <div class="score" id="scoreDraw">0</div>
    </div>
    <div class="score-card o" id="cardO">
      <div class="name">Player O</div>
      <div class="score" id="scoreO">0</div>
    </div>
  </div>

  <div class="game-container">
    <div class="board" id="board"></div>
  </div>

  <div class="status" id="status">
    <span class="turn-x">Player X</span>'s turn
  </div>

  <div class="controls">
    <button class="primary" id="newRound">New Round</button>
    <button id="resetScores">Reset Scores</button>
  </div>

  <script>
    const boardEl = document.getElementById('board');
    const statusEl = document.getElementById('status');
    const scoreXEl = document.getElementById('scoreX');
    const scoreOEl = document.getElementById('scoreO');
    const scoreDrawEl = document.getElementById('scoreDraw');
    const cardX = document.getElementById('cardX');
    const cardO = document.getElementById('cardO');
    const newRoundBtn = document.getElementById('newRound');
    const resetBtn = document.getElementById('resetScores');

    let board = ['', '', '', '', '', '', '', '', ''];
    let currentPlayer = 'X';
    let gameActive = true;
    let scores = { X: 0, O: 0, Draw: 0 };

    const winConditions = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8],
      [0, 3, 6], [1, 4, 7], [2, 5, 8],
      [0, 4, 8], [2, 4, 6]
    ];

    // Initialize board
    function createBoard() {
      boardEl.innerHTML = '';
      board.forEach((_, index) => {
        const cell = document.createElement('button');
        cell.classList.add('cell');
        cell.dataset.index = index;
        cell.addEventListener('click', () => handleCellClick(index));
        boardEl.appendChild(cell);
      });
    }

    function handleCellClick(index) {
      if (!gameActive || board[index] !== '') return;

      board[index] = currentPlayer;
      const cell = boardEl.children[index];
      cell.textContent = currentPlayer;
      cell.classList.add(currentPlayer.toLowerCase());
      cell.classList.add('pop');

      if (checkWin()) {
        endGame(false);
      } else if (checkDraw()) {
        endGame(true);
      } else {
        currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
        updateStatus();
        toggleActiveCard();
      }
    }

    function checkWin() {
      return winConditions.some(combo => {
        const [a, b, c] = combo;
        if (board[a] && board[a] === board[b] && board[a] === board[c]) {
          highlightWin(combo);
          return true;
        }
        return false;
      });
    }

    function highlightWin(combo) {
      combo.forEach(idx => {
        boardEl.children[idx].classList.add('winner');
      });
    }

    function checkDraw() {
      return board.every(cell => cell !== '');
    }

    function endGame(isDraw) {
      gameActive = false;

      if (isDraw) {
        statusEl.innerHTML = "It's a <span class='winner-text'>Draw!</span>";
        scores.Draw++;
        scoreDrawEl.textContent = scores.Draw;
      } else {
        statusEl.innerHTML = `<span class="${currentPlayer.toLowerCase()}">${currentPlayer}</span> wins!`;
        scores[currentPlayer]++;
        if (currentPlayer === 'X') scoreXEl.textContent = scores.X;
        else scoreOEl.textContent = scores.O;
      }
    }

    function updateStatus() {
      statusEl.innerHTML = `<span class="turn-${currentPlayer.toLowerCase()}">${currentPlayer}</span>'s turn`;
    }

    function toggleActiveCard() {
      cardX.classList.toggle('active', currentPlayer === 'X');
      cardO.classList.toggle('active', currentPlayer === 'O');
    }

    function newRound() {
      board = ['', '', '', '', '', '', '', '', ''];
      gameActive = true;
      currentPlayer = 'X';
      createBoard();
      updateStatus();
      toggleActiveCard();
    }

    function resetScores() {
      scores = { X: 0, O: 0, Draw: 0 };
      scoreXEl.textContent = '0';
      scoreOEl.textContent = '0';
      scoreDrawEl.textContent = '0';
      newRound();
    }

    newRoundBtn.addEventListener('click', newRound);
    resetBtn.addEventListener('click', resetScores);

    // Start
    createBoard();
    updateStatus();
    toggleActiveCard();
  </script>
</body>
</html>
